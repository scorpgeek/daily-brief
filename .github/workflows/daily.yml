name: daily brief

# Fires when the Telegram bot commits a PDF into incoming/.
on:
  push:
    branches: [main]
    paths: ['incoming/*.pdf']
  workflow_dispatch:
    inputs:
      stem:
        description: 'Issue date, YYYY-MM-DD'
        required: false
        default: ''

# Never let two issues build at once -- they would race on the aliases.
concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pypdf
        run: pip install --quiet pypdf

      # PROMPT.md is gitignored on purpose -- it names an employer, a client
      # account and career goals, and this repo is public. So it travels as a
      # secret instead. Base64 because a secret holding prose is easy to mangle
      # on the way in, and the file has to arrive byte-for-byte.
      - name: Provide the briefing spec
        env:
          DB_PROMPT_B64: ${{ secrets.DB_PROMPT_B64 }}
        run: |
          if [ -f PROMPT.md ]; then
            echo "using the committed PROMPT.md"
          elif [ -n "$DB_PROMPT_B64" ]; then
            echo "$DB_PROMPT_B64" | base64 -d > PROMPT.md
            echo "restored PROMPT.md from secrets ($(wc -c < PROMPT.md) bytes)"
          else
            echo "::error::No PROMPT.md and no DB_PROMPT_B64 secret."
            echo "::error::See SETUP-AUTOMATION.md -- the spec is deliberately"
            echo "::error::not committed, and it has to reach this runner."
            exit 1
          fi
          # fail here rather than after a slow model call
          grep -q 'DASHBOARD SHAPE' PROMPT.md || {
            echo "::error::PROMPT.md does not look like the briefing spec."; exit 1; }
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          import brief_ai
          spec = brief_ai.load_spec()
          shape = brief_ai.shape_from_spec(spec)
          assert "const BRIEF" in shape, "spec has no JSON shape in it"
          print(f"spec ok: {len(spec):,} chars, shape {len(shape):,} chars")
          PY

      - name: Build the brief
        env:
          DB_API_BASE: ${{ secrets.DB_API_BASE }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          DB_MODEL: ${{ secrets.DB_MODEL }}
          STEM: ${{ inputs.stem }}
        run: |
          set -euo pipefail
          if [ -n "${STEM:-}" ]; then
            python daily.py --date "$STEM" --no-push --folder incoming
          else
            python daily.py --no-push --folder incoming
          fi

      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- phone.html desk.html archive
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -q -m "Publish briefing from incoming/"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "### Briefing published"
            echo
            echo "- archive: ${{ github.server_url }}/${{ github.repository }}/ARCHIVE.html"
            echo "- current:  ${{ github.server_url }}/${{ github.repository }}/"
          } >> "$GITHUB_STEP_SUMMARY"