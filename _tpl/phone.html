<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief — {{DATE_LONG}}</title>
<style>
/* ============================================================
   DAILY BRIEF — phone-first reading surface
   17 sections · three bands · collapsible · dark default
   ============================================================ */

:root{
  --bg:#0f0f0e; --panel:#171716; --panel-2:#1e1e1c; --ink:#eceae4;
  --muted:#918e86; --faint:#88857e; --line:#2a2a27; --line-2:#35342f;

  --use:#e87461;            /* band 1 accent — act on these */
  --ref:#c9a260;            /* band 2 accent — reference */
  --lang:#80a98b;           /* band 3 accent — language */

  /* chip text solved against a 13% tint of itself — see desk template */
  --chip-use:#e87563; --chip-ref:#caa362; --chip-faint:#8d8b87; --chip-lang:#81aa8c;

  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Cascadia Code,Menlo,Consolas,monospace;

  /* type scale — line-height is the load-bearing value here */
  --t-body:1.62; --t-tight:1.28; --t-measure:68ch;
}
/* Warm paper rather than white: no pure #fff, no pure black text. Matches
   the desk edition so the two editions read as one thing. */
[data-theme="light"]{
  --bg:#f7f4ed; --panel:#fdfbf6; --panel-2:#efeade; --ink:#211f1a;
  --muted:#56534b; --faint:#6b6863; --line:#e3ded1; --line-2:#d1cbba;
  --use:#a6261a; --ref:#8c611a; --lang:#3b694a;
  --chip-use:#a4261a; --chip-ref:#8b601a; --chip-faint:#6a6762; --chip-lang:#3a6849;
  --shadow:0 1px 2px rgba(60,50,30,.06), 0 10px 30px rgba(60,50,30,.07);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/var(--t-body) var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:80px;
}
@media (min-width:720px){ body{font-size:17px} }

.shell{max-width:720px;margin:0 auto;padding:0 18px}

/* ---------- masthead ---------- */
.mast{
  position:sticky;top:0;z-index:60;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:14px 0 12px;
}
.mast::after{
  content:"";display:block;height:2px;margin-top:12px;border-radius:2px;
  background:linear-gradient(90deg,var(--use) 0%,var(--ref) 50%,var(--lang) 100%);
  opacity:.85;
}
.mast-in{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kicker{
  font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);margin-bottom:7px;
}
h1{
  font:600 clamp(21px,5.2vw,28px)/1.15 var(--serif);
  margin:0;letter-spacing:-.02em;flex:1 1 auto;
}
.meta{font:400 11px/1.5 var(--mono);color:var(--faint);white-space:nowrap}
.toggle{
  font:500 11px/1 var(--sans);padding:7px 11px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--muted);
  cursor:pointer;transition:background .12s,color .12s;
}
.toggle:hover{color:var(--ink);background:var(--panel-2)}
.toggle-a{display:inline-block;text-decoration:none}

/* Newspaper switcher. Native <details>, so tap-to-open, focus and Escape
   are handled by the browser and it still works with scripting off. The
   menu is absolutely positioned and the masthead has no overflow clip, so
   it escapes the sticky header rather than being cut off by it. Larger
   targets than the desk: this is the edition used with a thumb. */
.pnav{position:relative}
.pnav>summary{
  list-style:none;display:inline-flex;align-items:center;gap:6px;
  font:500 11px/1 var(--sans);padding:7px 11px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--muted);
  cursor:pointer;transition:background .12s,color .12s;
}
.pnav>summary:hover{color:var(--ink);background:var(--panel-2)}
.pnav>summary::-webkit-details-marker{display:none}
.pnav-c{width:0;height:0;margin-top:3px;
  border:4px solid transparent;border-top-color:currentColor}
.pnav[open]>.pnav-menu{display:block}
.pnav[open] .pnav-c{margin-top:-2px;border-top-color:transparent;
  border-bottom-color:currentColor}
.pnav-menu{
  position:absolute;right:0;top:calc(100% + 10px);z-index:70;display:none;
  min-width:262px;padding:7px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);
}
.pnav-h{font:600 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);padding:6px 9px 9px}
.pnav-row{display:flex;align-items:center;gap:6px;padding:0 2px 0 9px;border-radius:8px}
.pnav-row:hover{background:var(--panel-2)}
.pnav-cur{background:var(--panel-2)}
.pnav-name{font:500 13px/1.35 var(--sans);color:var(--ink);
  margin-right:auto;padding:8px 0}
.pnav-now{display:block;font:600 8.5px/1 var(--mono);letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);margin-top:3px}
.pnav-l{font:500 11.5px/1 var(--sans);color:var(--muted);text-decoration:none;
  padding:8px 9px;border-radius:7px;border:1px solid var(--line)}
.pnav-l:hover{color:var(--ink);border-color:var(--line-2)}

/* ---------- 30-second block ---------- */
.thirty{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--use);
  border-radius:0 12px 12px 0;padding:18px 20px;margin:22px 0 8px;
}
.thirty h2{
  font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--use);margin:0 0 14px;
}
.ts-row{display:grid;grid-template-columns:78px 1fr;gap:10px 14px;align-items:start}
.ts-row dt{
  font:600 10px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding-top:2px;
}
.ts-row dd{margin:0;font-size:15px;line-height:1.5}
@media (max-width:420px){ .ts-row{grid-template-columns:1fr;gap:2px 0}
  .ts-row dt{margin-top:10px} .ts-row dt:first-of-type{margin-top:0} }

/* ---------- bands ---------- */
.band{margin:44px 0 0}
.band-head{
  display:flex;align-items:center;gap:12px;margin-bottom:6px;
}
.band-label{
  font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);
}
.band-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.band-note{font:400 12px/1.4 var(--sans);color:var(--faint);margin:0 0 18px}

.band-use{--accent:var(--use);--accent-chip:var(--chip-use)}
.band-ref{--accent:var(--ref);--accent-chip:var(--chip-ref)}
.band-lang{--accent:var(--lang);--accent-chip:var(--chip-lang)}

/* ---------- sections ---------- */
.sec{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin-bottom:12px;overflow:hidden;
}
.sec>summary{
  list-style:none;cursor:pointer;padding:16px 18px;
  display:flex;align-items:center;gap:12px;
  transition:background .12s;
}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:var(--panel-2)}
.sec-n{
  font:700 10px/1 var(--mono);letter-spacing:.1em;color:var(--accent);
  min-width:22px;
}
.sec-title{font:600 15.5px/1.3 var(--sans);flex:1;letter-spacing:-.01em}
.sec-flag{
  font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-chip);background:color-mix(in srgb,var(--accent) 13%,transparent);
  padding:4px 7px;border-radius:4px;
}
.chev{
  width:8px;height:8px;border-right:1.5px solid var(--faint);
  border-bottom:1.5px solid var(--faint);transform:rotate(45deg);
  transition:transform .12s ease;flex:none;margin-right:2px;
}
.sec[open] .chev{transform:rotate(-135deg)}
.sec-body{
  padding:2px 18px 20px;border-top:1px solid var(--line);margin-top:-1px;
}
.sec-body>*:first-child{margin-top:18px}
.sec-body>*:last-child{margin-bottom:0}

/* ---------- prose ---------- */
.sec-body p{margin:0 0 12px;max-width:var(--t-measure)}
.sec-body ul{margin:0 0 12px;padding-left:20px;max-width:var(--t-measure)}
.sec-body li{margin-bottom:7px}
.sec-body b,strong{font-weight:650}
em{color:var(--accent);font-style:normal}
.h3{
  font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:22px 0 10px;padding-top:4px;
}
.h3:first-child{margin-top:18px}

/* ---------- top 5 ---------- */
.top-item{
  display:grid;grid-template-columns:auto 1fr;gap:10px 12px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.top-item:last-child{border-bottom:0;padding-bottom:0}
.top-item:first-child{padding-top:4px}
.tag{
  font:700 9.5px/1 var(--mono);letter-spacing:.08em;
  padding:5px 7px;border-radius:4px;height:fit-content;white-space:nowrap;
}
.tag.ACT{color:var(--chip-use);background:color-mix(in srgb,var(--use) 13%,transparent)}
.tag.WATCH{color:var(--chip-ref);background:color-mix(in srgb,var(--ref) 13%,transparent)}
.tag.KNOW{color:var(--chip-faint);background:color-mix(in srgb,var(--faint) 13%,transparent)}
.top-text{font-size:15.5px;line-height:1.5}
.top-note{
  grid-column:2;font-size:13px;color:var(--muted);line-height:1.5;
  padding-top:3px;
}
.top-note b{color:var(--accent);font-weight:600}

/* ---------- numbers ---------- */
.nums{display:grid;gap:1px;background:var(--line);border-radius:9px;overflow:hidden}
.num{
  background:var(--panel-2);padding:14px 16px;
  display:flex;align-items:baseline;gap:14px;
}
.num-v{
  font:600 22px/1 var(--serif);letter-spacing:-.02em;
  min-width:82px;flex:none;color:var(--accent);
}
.num-l{font-size:13.5px;color:var(--muted);line-height:1.45}

/* ---------- dates ---------- */
.dates{list-style:none;margin:0;padding:0}
.dates li{
  display:grid;grid-template-columns:96px 1fr;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline;
}
.dates li:last-child{border-bottom:0}
.dates .d{
  font:600 11.5px/1.4 var(--mono);color:var(--muted);letter-spacing:.02em;
}
.dates .d.soon{color:var(--use)}
.dates .w{font-size:14.5px;line-height:1.5}

/* ---------- my lens ---------- */
.lens{border-left:2px solid var(--accent);padding-left:16px;margin-bottom:20px}
.lens:last-child{margin-bottom:0}
.lens dl{margin:0}
.lens dt{
  font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-top:11px;
}
.lens dt:first-child{margin-top:0}
.lens dd{margin:2px 0 0;font-size:15px;line-height:1.55}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:340px}
caption{
  caption-side:top;text-align:left;font-size:13.5px;color:var(--muted);
  line-height:1.5;padding-bottom:12px;max-width:var(--t-measure);
}
th{
  font:600 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:0 12px 8px 0;
  border-bottom:1px solid var(--line-2);
}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
th.n{text-align:right;padding-right:0}

/* ---------- quotes / citations ---------- */
.src{
  font:400 10.5px/1.4 var(--mono);color:var(--faint);
  letter-spacing:.04em;display:block;margin-top:10px;
}
blockquote{
  margin:14px 0;padding:2px 0 2px 16px;border-left:2px solid var(--line-2);
  color:var(--muted);font-size:14.5px;max-width:var(--t-measure);
}
blockquote p{margin:0 0 8px}

/* ---------- opinion entries ---------- */
.op{border-top:1px solid var(--line);padding:16px 0}
.op:first-of-type{border-top:0;padding-top:4px}
.op h4{font:600 15.5px/1.3 var(--serif);margin:0 0 3px;letter-spacing:-.01em}
.op-by{font:400 11px/1.4 var(--mono);color:var(--faint);margin:0 0 12px}
.op-row{display:grid;grid-template-columns:74px 1fr;gap:3px 12px;font-size:14px;line-height:1.55}
.op-row dt{font:600 9.5px/1.65 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.op-row dd{margin:0 0 7px}
@media (max-width:420px){ .op-row{grid-template-columns:1fr} .op-row dt{margin-top:8px} }

/* ---------- tables of vocab ---------- */
/* the phone table is four narrow columns — POS would break the measure */
.vocab .pos{display:none}
.vocab{width:100%;border-collapse:collapse;font-size:14px}
.vocab th{
  font:600 9.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  text-align:left;padding:0 10px 8px 0;border-bottom:1px solid var(--line-2);
  color:var(--faint);white-space:nowrap;
}
.vocab td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.vocab tr:last-child td{border-bottom:0}
.vocab td:first-child{font-weight:600;white-space:nowrap;color:var(--accent)}

/* ---------- traps ---------- */
.trap{padding:13px 0;border-bottom:1px solid var(--line)}
.trap:last-child{border-bottom:0;padding-bottom:0}
.trap-row{display:grid;gap:5px}
.trap-bad{
  font-size:14.5px;color:var(--muted);text-decoration:line-through;
  text-decoration-color:var(--faint);text-decoration-thickness:1px;
}
.trap-good{font-size:14.5px}
.trap-good b{color:var(--lang)}
.trap-why{font-size:13px;color:var(--muted);line-height:1.5;padding-top:3px}

/* ---------- speak / quiz ---------- */
.speak{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:14px;
}
.speak h4,.quiz h4{
  font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px;
}
.speak .q{font:600 15px/1.5 var(--serif);margin:0 0 14px;letter-spacing:-.01em}
.model{
  border-top:1px dashed var(--line-2);padding-top:13px;
  font-size:14.5px;line-height:1.6;color:var(--muted);max-width:var(--t-measure);
}
.model em{color:var(--lang);font-style:normal}
/* ---------- quiz ----------
   Options are buttons, not text. The container carries ans-<key> so the
   correct row can be styled without comparing attributes in CSS, and
   .done is added by the tap handler once the question is answered. */
.quiz{border-bottom:1px solid var(--line);padding:14px 0}
.quiz:last-child{border-bottom:0}
.quiz .q{font-size:14.5px;line-height:1.55;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opt{
  display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;
  width:100%;text-align:left;cursor:pointer;font:inherit;position:relative;
  font-size:14px;line-height:1.5;color:var(--muted);padding-right:36px;
  background:none;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
}
/* the mark is the feedback — a tint alone is too quiet to read as "right" */
.opt::after{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font:600 13px/1 var(--sans);opacity:0;
}
.opt.right::after{content:"\2713";color:var(--chip-lang);opacity:1}
.opt.wrong::after{content:"\2715";color:var(--chip-use);opacity:1}
.opt:hover{border-color:var(--line-2);color:var(--ink)}
.opt .k{
  font:600 10px/1.45 var(--mono);letter-spacing:.06em;color:var(--faint);
  border:1px solid var(--line);border-radius:4px;text-align:center;
}
.quiz .why{
  display:none;margin:11px 0 0;padding:9px 0 0 12px;
  border-left:2px solid var(--lang);
  font-size:13.5px;line-height:1.55;color:var(--muted);
}
.quiz.done .why{display:block}
.quiz.ans-a.done .opt[data-k="a"],
.quiz.ans-b.done .opt[data-k="b"],
.quiz.ans-c.done .opt[data-k="c"],
.quiz.ans-d.done .opt[data-k="d"]{
  border-color:var(--lang);color:var(--ink);
  background:color-mix(in srgb,var(--lang) 11%,transparent);
}
.quiz.ans-a.done .opt[data-k="a"] .k,
.quiz.ans-b.done .opt[data-k="b"] .k,
.quiz.ans-c.done .opt[data-k="c"] .k,
.quiz.ans-d.done .opt[data-k="d"] .k{color:var(--chip-lang);border-color:transparent}
.opt.wrong{
  border-color:var(--use);color:var(--faint);
  background:color-mix(in srgb,var(--use) 9%,transparent);
}
.opt.wrong .k{color:var(--chip-use);border-color:transparent}
.opt.wrong .ot{text-decoration:line-through}
.opt:disabled{cursor:default}

/* ---------- back to top ----------
   Seventeen folds stack a long way down and a phone has no Home key.
   One 120ms opacity fade, matching the disclosure chevron; nothing else
   in this document animates. */
.totop{
  position:fixed;z-index:50;bottom:20px;right:18px;
  width:42px;height:42px;border-radius:50%;padding:0;
  display:grid;place-items:center;cursor:pointer;
  background:var(--panel);border:1px solid var(--line-2);color:var(--muted);
  box-shadow:var(--shadow);font:400 17px/1 var(--sans);
  opacity:0;pointer-events:none;transition:opacity .12s;
}
.totop.show{opacity:1;pointer-events:auto}
.totop:active{color:var(--ink)}
.totop:focus-visible{outline:2px solid var(--lang);outline-offset:2px}
@media print{ .totop{display:none} }

/* ---------- skip ---------- */
.skip{
  background:var(--panel-2);border:1px dashed var(--line-2);border-radius:10px;
  padding:15px 17px;font-size:14px;color:var(--muted);line-height:1.6;
}

/* ---------- long-form read ---------- */
.longform{max-width:var(--t-measure)}
.longform>p{font-size:15.5px;line-height:1.62}
.beat{
  margin:0 0 18px;padding:2px 0 2px 15px;
  border-left:2px solid var(--line-2);
}
.beat:last-child{margin-bottom:0}
.beat-k{
  font:600 9.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:7px;
}
.beat p{font-size:15px;line-height:1.6;margin:0 0 9px}
.beat p:last-child{margin-bottom:0}
.beat.falsifier{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);
  border-radius:0 8px 8px 0;padding:13px 15px}
.byline{
  font:400 11.5px/1.4 var(--mono);color:var(--faint);margin:0 0 20px;
  padding-bottom:14px;border-bottom:1px solid var(--line);
}

/* ---------- deep dive ---------- */
.dd{border-top:1px solid var(--line);padding:18px 0 4px}
.dd:first-of-type{border-top:0;padding-top:4px}
.dd h4{
  font:600 16px/1.3 var(--serif);margin:0 0 4px;letter-spacing:-.01em;
}
.dd-page{font:400 10.5px/1.4 var(--mono);color:var(--faint);margin:0 0 14px}
.dd-row{display:grid;grid-template-columns:96px 1fr;gap:3px 14px;font-size:14.5px;line-height:1.55}
.dd-row dt{
  font:600 9.5px/1.7 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);
}
.dd-row dd{margin:0 0 9px;max-width:var(--t-measure)}
@media (max-width:460px){
  .dd-row{grid-template-columns:1fr}
  .dd-row dt{margin-top:9px}
}

/* ---------- hindi / phrases ---------- */
.hindi{width:100%;border-collapse:collapse;font-size:14.5px}
.hindi td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.hindi tr:last-child td{border-bottom:0}
.hindi td:first-child{font-weight:600;color:var(--accent);white-space:nowrap;width:34%}
.hindi .dev{font-size:15px}
.hindi .pron{font:400 12px/1.4 var(--mono);color:var(--faint);white-space:nowrap}
.phrase{
  padding:13px 0;border-bottom:1px solid var(--line);
}
.phrase:last-child{border-bottom:0;padding-bottom:0}
.phrase-t{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px;
}
.phrase-w{font:600 15px/1.3 var(--sans);color:var(--accent)}
.phrase-tone{
  font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--line-2);padding:4px 6px;border-radius:4px;
}
.phrase-m{font-size:13.5px;color:var(--muted);margin:0 0 6px;line-height:1.5}
.phrase-e{
  font-size:14px;line-height:1.55;padding-left:12px;
  border-left:2px solid var(--line-2);
}

/* ---------- read aloud ----------
   A bottom sheet, not a centred panel: this edition is read one-handed,
   often at night, and the section list is the control that matters.
   Native <dialog>, so the focus trap and Escape are the browser's job
   and the backdrop comes for free. */
.tts{
  border:0;padding:0;margin:0;
  position:fixed;inset:auto 0 0 0;
  width:100%;max-width:100%;max-height:88vh;
  background:var(--panel);color:var(--ink);
  border-radius:16px 16px 0 0;box-shadow:var(--shadow);
}
.tts::backdrop{background:rgba(12,11,9,.5);backdrop-filter:blur(2px)}
/* Flex only while open. Setting display on the dialog at all would defeat
   the user-agent rule that keeps a closed dialog hidden. */
.tts[open]{display:flex;flex-direction:column}
.tts-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 0;
}
.tts-t{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.tts-x{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--panel);color:var(--muted);font-size:17px;line-height:1;cursor:pointer;
}
.tts-x:hover{color:var(--ink);background:var(--panel-2)}
.tts-now{
  margin:12px 18px 0;padding:11px 13px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);
  font:500 13px/1.4 var(--sans);color:var(--ink);
}
.tts-ctl{display:flex;align-items:center;gap:7px;padding:12px 18px 0;flex-wrap:wrap}
.tts-b{
  font:500 12.5px/1 var(--sans);padding:11px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
}
.tts-b:hover{color:var(--ink);border-color:var(--line-2)}
.tts-p{background:var(--ink);color:var(--panel);border-color:var(--ink);min-width:84px}
.tts-p:hover{color:var(--panel);background:var(--ink);opacity:.88}
.tts-rate{display:flex;gap:4px;margin-left:auto}
.tts-rate button{
  font:500 11px/1 var(--mono);padding:10px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
}
.tts-rate button.on{color:var(--ink);border-color:var(--line-2);background:var(--panel-2)}
.tts-vl{
  display:block;margin:14px 18px 5px;
  font:600 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}
.tts-v{
  display:block;width:calc(100% - 36px);margin:0 18px;
  font:500 12.5px/1 var(--sans);padding:11px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
}
.tts-list{
  margin:12px 0 0;padding:0 8px 8px;overflow-y:auto;
  flex:1 1 auto;min-height:90px;
  background:none;border:0;border-radius:0;
}
.tts-g{
  font:600 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);padding:13px 10px 7px;
}
.tts-i{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:10px;border:0;border-radius:8px;background:none;cursor:pointer;
}
.tts-i:hover{background:var(--panel-2)}
.tts-i .n{font:600 10px/1.5 var(--mono);color:var(--faint);text-align:right;min-width:24px}
.tts-i .t{font:500 13px/1.4 var(--sans);color:var(--muted)}
.tts-i.on{background:var(--panel-2)}
.tts-i.on .t{color:var(--ink)}
.tts-i.on .n{color:var(--use)}
.tts-f{
  margin:0;padding:11px 18px 20px;border-top:1px solid var(--line);
  font:400 10.5px/1.4 var(--mono);color:var(--faint);
}
/* The list takes the slack; the controls never shrink. */
.tts-h,.tts-now,.tts-ctl,.tts-vl,.tts-v,.tts-f{flex:0 0 auto}

/* The word being read. A tint of the accent rather than a solid block, so
   the text underneath keeps its contrast -- the highlight is a reading aid,
   not a re-colouring of the sentence. */
.spoken{background:color-mix(in srgb, var(--ref) 30%, transparent);border-radius:2px}

/* ---------- print ---------- */
@media print{
  :root{--shadow:none}
  body{background:#fff;font-size:10.5pt}
  .mast{position:static}
  .toggle{display:none}
  .tts{display:none}
  .sec{break-inside:avoid;border-color:#ccc;margin-bottom:8px}
  .sec:not([open])>.sec-body{display:block}
  .band{margin-top:20px}
  .thirty{border-left-color:#000}
  .tw{overflow:visible;margin:0;padding:0}
  details{open:true}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="mast">
  <div class="shell mast-in">
    <div style="flex:1 1 auto">
      <div class="kicker">Daily Brief</div>
      <h1>{{DATE_LONG}}</h1>
    </div>
    <div class="meta">{{NEWSPAPER}} · {{PAGES}}pp</div>
    {{PAPERS}}
    <button class="toggle" data-tts-open>Listen</button>
    <a class="toggle toggle-a" href="#" data-archive>Archive</a>
    <button class="toggle" id="thBtn" onclick="toggleTheme()">◐ Light</button>
  </div>
</header>

<dialog class="tts" id="tts" aria-label="Read aloud">
  <div class="tts-h">
    <span class="tts-t">Listen</span>
    <button class="tts-x" id="ttsClose" aria-label="Close">&times;</button>
  </div>
  <p class="tts-now" id="ttsNow">Press play to start reading.</p>
  <div class="tts-ctl">
    <button class="tts-b" id="ttsBack" aria-label="Previous section">&larr;</button>
    <button class="tts-b tts-p" id="ttsPlay" aria-pressed="false">Play</button>
    <button class="tts-b" id="ttsStop" aria-label="Stop">&#9632;</button>
    <div class="tts-rate" id="ttsRate" role="group" aria-label="Speed">
      <button data-rate="0.8">0.8&times;</button>
      <button data-rate="1" class="on">1&times;</button>
      <button data-rate="1.15">1.15&times;</button>
    </div>
  </div>
  <label class="tts-vl" for="ttsVoice">Voice</label>
  <select class="tts-v" id="ttsVoice"></select>
  <div class="tts-b tts-list" id="ttsList"></div>
  <p class="tts-f">Words highlight as they are read &middot; Esc to close</p>
</dialog>

<template id="ttsRow">
  <button class="tts-i"><span class="n"></span><span class="t"></span></button>
</template>

<button class="totop" id="toTop" type="button" aria-label="Back to top">&#8593;</button>

<script>
/* Label shows the theme the button switches TO, and the choice persists —
   a night reader who picks light should not find dark again on reload. */
function paintTheme(){
  const dark = document.documentElement.dataset.theme==='dark';
  document.getElementById('thBtn').textContent = dark ? '◐ Light' : '◑ Dark';
}
function toggleTheme(){
  const r = document.documentElement;
  r.dataset.theme = darkNow() ? 'light' : 'dark';
  paintTheme(); localStorage.setItem('dbth', r.dataset.theme);
}
function darkNow(){ return document.documentElement.dataset.theme !== 'light'; }
(function(){
  const th = localStorage.getItem('dbth');
  if(th) document.documentElement.dataset.theme = th;
  paintTheme();
})();

/* One template renders to the project root and into archive/, so the
   Archive link's relative path differs. The newspaper switcher needs none
   of this: build_brief.py writes its hrefs already relative to wherever it
   is about to save. A <details> does not close on an outside tap by
   itself, so it would hang over the text you just tapped. */
(function(){
  var up = /\/archive\//.test(location.pathname) ? '../' : '';
  document.querySelectorAll('[data-archive]').forEach(function(a){
    a.href = up + 'ARCHIVE.html';
  });
  var pnav = document.getElementById('pnav');
  if(!pnav) return;
  document.addEventListener('click', function(e){
    if(pnav.open && !pnav.contains(e.target)) pnav.open = false;
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && pnav.open){
      pnav.open = false;
      pnav.querySelector('summary').focus();
    }
  });
})();

/* Appears once you are past the first screen; html{scroll-behavior:smooth}
   does the scrolling. */
(function(){
  var b = document.getElementById('toTop');
  function onScroll(){ b.classList.toggle('show', window.scrollY > 600); }
  addEventListener('scroll', onScroll, {passive:true});
  b.addEventListener('click', function(){ scrollTo({top:0, behavior:'smooth'}); });
  onScroll();
})();

/* One answer per question: the tap is marked, the right option is
   revealed either way, and the explanation opens. */
document.addEventListener('click', function(e){
  var o = e.target.closest('.opt');
  if(!o) return;
  var z = o.closest('.quiz');
  if(!z || z.classList.contains('done')) return;
  z.querySelectorAll('.opt').forEach(function(b){
    if(b.dataset.k===z.dataset.answer) b.classList.add('right');
    else if(b===o) b.classList.add('wrong');
    b.disabled = true;
  });
  z.classList.add('done');
});
</script>
<!--TTS-->

<div class="shell"><!--SECTIONS-->
  </div>
</div>

</body>
</html>
