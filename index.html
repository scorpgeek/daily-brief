<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f7f4ed; --panel:#fdfbf6; --panel-2:#efeade; --ink:#211f1a;
    --muted:#56534b; --faint:#6b6863; --line:#e3ded1; --line2:#d1cbba;
    --use:#a6261a; --ref:#8c611a; --lang:#3b694a;
    --chip-use:#a4261a; --chip-ref:#8b601a; --chip-faint:#6a6762; --chip-lang:#3a6849;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Cascadia Code,Menlo,Consolas,monospace;
  }
  [data-theme="dark"]{
    --bg:#0e0e0d; --panel:#161615; --panel-2:#1c1c1a; --ink:#ecebe6;
    --muted:#8e8b84; --faint:#868480; --line:#282825; --line2:#353430;
    --use:#e87461; --ref:#c9a260; --lang:#80a98b;
    --chip-use:#e87563; --chip-ref:#caa362; --chip-faint:#8d8b87; --chip-lang:#81aa8c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;
    background:var(--bg);color:var(--ink);
    font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  }
  .w{width:min(560px,100%);text-align:center}
  .k{font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  h1{font:600 30px/1.15 var(--serif);letter-spacing:-.02em;margin:10px 0 6px}
  .sub{font-size:14px;color:var(--muted);margin:0 0 26px}
  .row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:20px}
  @media (max-width:460px){ .row{grid-template-columns:1fr} }
  /* Paper groups stack: name, then its two surfaces. With one paper the
     heading is skipped so the page stays as spare as it was. */
  .grp{margin-bottom:22px;text-align:left}
  .grp:last-child{margin-bottom:0}
  .grp-n{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
    color:var(--faint);margin:0 0 9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  a.card{
    display:block;text-decoration:none;color:var(--ink);text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;transition:border-color .12s,background .12s;
  }
  a.card:hover{border-color:var(--line2);background:var(--panel-2)}
  a.card:focus-visible{outline:2px solid var(--lang);outline-offset:2px}
  .card-t{font:600 15px/1.3 var(--serif);margin-bottom:5px}
  .card-d{font-size:13px;line-height:1.5;color:var(--muted)}
  .note{font-size:12.5px;color:var(--faint);margin:0}
  .note b{color:var(--chip-use);font-weight:600}
  .note code{font-family:var(--mono);font-size:11.5px}
  .empty{font-size:14px;color:var(--muted);padding:10px 0 4px}
  .themedot{
    position:fixed;top:16px;right:16px;background:none;border:1px solid var(--line);
    color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;
    font:500 11px/1 var(--sans);
  }
  .themedot:hover{color:var(--ink);background:var(--panel)}
</style>
</head>
<body>
<button class="themedot" onclick="
  const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='light' ? 'dark' : 'light';
  localStorage.setItem('dbth', r.dataset.theme);
">Theme</button>

<div class="w">
  <div class="k">Daily Brief</div>
  <h1 id="title">Daily Brief</h1>
  <p class="sub" id="sub">Working out what&rsquo;s here&hellip;</p>

  <div id="picks"></div>

  <p class="note" id="note" style="display:none"></p>

  <p class="note" style="margin-top:20px"><a href="ARCHIVE.html" style="color:inherit">Past editions &rarr;</a></p>
</div>

<script>
/* One URL, every device and every paper.

   The paper list is read from archive/manifest.json rather than written
   here, so adding a third newspaper needs no edit to this file -- build
   it, commit, and it appears. Each edition is checked with a HEAD request
   before we send anyone to it, because the alias is generated at build
   time and a stale deploy should land on the chooser, not a 404. */
(function(){
  var K_PAPER = 'dbpaper', K_SURF = 'dbed';
  var savedPaper = null, savedSurf = null;
  try {
    savedPaper = localStorage.getItem(K_PAPER);
    savedSurf  = localStorage.getItem(K_SURF);
  } catch(e){}

  function viewportSurface(){
    return window.innerWidth >= 900 ? 'desk' : 'phone';
  }

  /* Latest edition per paper. Both surfaces are always written by the
     build, so neither is filtered here -- a HEAD probe on the chosen one
     catches a stale deploy instead. */
  function papersFrom(rows){
    var bySlug = {}, order = [];
    rows.forEach(function(e){
      if(!e || !e.slug || !e.date) return;
      var cur = bySlug[e.slug];
      var name = e.paper || e.newspaper || '';
      if(!cur){
        cur = bySlug[e.slug] = {slug:e.slug, paper:name, date:e.date};
        order.push(e.slug);
      }
      if(e.date > cur.date){ cur.date = e.date; if(name) cur.paper = name; }
    });
    // The manifest is ordered by date then slug, so papers arrive in reverse
    // alphabetical order for no reason. A chooser should read the same way
    // every time.
    return order.map(function(s){ return bySlug[s]; })
      .sort(function(a, b){
        var an = (a.paper || a.slug).toLowerCase();
        var bn = (b.paper || b.slug).toLowerCase();
        return an < bn ? -1 : an > bn ? 1 : 0;
      });
  }

  function cardFor(p, surf, title, blurb){
    return '<a class="card" href="' + p.slug + (surf === 'desk' ? '-desk' : '') + '.html"'
      + ' data-slug="' + esc(p.slug) + '" data-surf="' + surf + '">'
      + '<div class="card-t">' + title + '</div>'
      + '<div class="card-d">' + blurb + '</div></a>';
  }

  function draw(list){
    document.getElementById('sub').textContent = list.length === 1
      ? 'One newspaper. Pick the surface that fits this screen.'
      : 'Pick a newspaper, then a surface. Same briefing, two shapes.';
    document.getElementById('picks').innerHTML = list.map(function(p){
      var name = p.paper || p.slug;
      var cards = cardFor(p, 'desk', 'Laptop',
        'Rail, glossary drawer, search, and the full section index. Built for a wide screen.');
      cards += cardFor(p, 'phone', 'Phone',
        'Three bands, everything folded except the first. Built for a thumb.');
      var head = list.length > 1
        ? '<div class="grp-n">' + esc(name) + '</div>' : '';
      return '<div class="grp">' + head + '<div class="row">' + cards + '</div></div>';
    }).join('');

    document.querySelectorAll('[data-slug]').forEach(function(a){
      a.addEventListener('click', function(){
        try {
          localStorage.setItem(K_PAPER, a.dataset.slug);
          localStorage.setItem(K_SURF, a.dataset.surf);
        } catch(e){}
      });
    });
  }

  function warn(html){
    var n = document.getElementById('note');
    n.style.display = '';
    n.innerHTML = html;
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function go(p, surf, list){
    var t = p.slug + (surf === 'desk' ? '-desk' : '') + '.html';
    fetch(t, {method:'HEAD'}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      location.replace(t);
    }).catch(function(){
      // The paper exists in the manifest but its alias isn't published --
      // an uncommitted build, or a deploy that hasn't landed. Show the
      // choices rather than bouncing.
      document.getElementById('sub').textContent = 'Pick a surface.';
      warn('<b>That edition isn&rsquo;t published yet.</b> Run '
         + '<code>python build_brief.py</code>, then commit the '
         + '<code>&lt;paper&gt;.html</code> aliases and <code>archive/</code>.');
      draw(list);
    });
  }

  function start(rows){
    var list = papersFrom(rows);
    if(!list.length){
      document.getElementById('sub').textContent = 'No editions built yet.';
      warn('<b>Nothing in the archive.</b> Run <code>python build_brief.py</code>, '
         + 'then commit the aliases and <code>archive/</code>.');
      return;
    }

    // Route automatically when we can be confident which paper is meant:
    // either it was chosen before, or there is only one to choose from.
    var known = null;
    list.forEach(function(p){ if(p.slug === savedPaper) known = p; });
    if(known) return go(known, savedSurf || viewportSurface(), list);
    if(list.length === 1) return go(list[0], savedSurf || viewportSurface(), list);

    document.getElementById('title').textContent = 'Which newspaper?';
    draw(list);
  }

  fetch('archive/manifest.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ start(Array.isArray(d) ? d : []); })
    .catch(function(){
      document.getElementById('sub').textContent = 'The index could not be read.';
      warn('<b>No manifest found.</b> This page lists newspapers from '
         + '<code>archive/manifest.json</code>. Run <code>python build_brief.py</code> '
         + 'and commit <code>archive/</code>. '
         + '<a href="ARCHIVE.html" style="color:inherit">Browse the archive &rarr;</a>');
    });

  (function(){
    var th = localStorage.getItem('dbth');
    if(th) document.documentElement.dataset.theme = th;
  })();
})();
</script>
</body>
</html>
