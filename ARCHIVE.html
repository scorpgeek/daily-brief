<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief — Archive</title>
<style>
  :root{
    --bg:#f7f4ed; --panel:#fdfbf6; --panel-2:#efeade; --ink:#211f1a;
    --muted:#56534b; --faint:#6b6863; --line:#e3ded1; --line2:#d1cbba;
    --use:#a6261a; --ref:#8c611a; --lang:#3b694a;
    --chip-use:#a4261a; --chip-ref:#8b601a; --chip-faint:#6a6762; --chip-lang:#3a6849;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Cascadia Code,Menlo,Consolas,monospace;
  }
  [data-theme="dark"]{
    --bg:#0e0e0d; --panel:#161615; --panel-2:#1c1c1a; --ink:#ecebe6;
    --muted:#8e8b84; --faint:#868480; --line:#282825; --line2:#353430;
    --use:#e87461; --ref:#c9a260; --lang:#80a98b;
    --chip-use:#e87563; --chip-ref:#caa362; --chip-faint:#8d8b87; --chip-lang:#81aa8c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.62 var(--sans);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 90px}
  header{
    position:sticky;top:0;z-index:10;background:var(--bg);
    border-bottom:1px solid var(--line);padding:16px 0 14px;margin-bottom:8px;
  }
  .topin{max-width:820px;margin:0 auto;padding:0 20px;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .k{font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  h1{font:600 26px/1.2 var(--serif);letter-spacing:-.02em;margin:6px 0 0}
  .sp{flex:1}
  .lnk{font:500 12px/1 var(--sans);padding:7px 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    text-decoration:none;white-space:nowrap}
  .lnk:hover{color:var(--ink);border-color:var(--line2)}

  .find{margin:26px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .find input{
    flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:10px 13px;color:var(--ink);
    font:14px var(--sans);outline:0;
  }
  .find input:focus{border-color:var(--muted)}
  .count{font:400 11.5px/1 var(--mono);color:var(--faint)}

  h2.month{
    font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin:30px 0 10px;padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .row{
    display:grid;grid-template-columns:96px 1fr;gap:8px 18px;
    padding:15px 0;border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:0}
  .d{font:600 13px/1.5 var(--mono);color:var(--muted);letter-spacing:.02em}
  .meta{font:400 10.5px/1.4 var(--mono);color:var(--faint);margin-top:3px}
  .hl{font-size:15px;line-height:1.5;margin:0 0 7px;max-width:62ch}
  .links{display:flex;gap:7px;flex-wrap:wrap}
  .tag{
    font:600 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:5px 8px;border-radius:4px;text-decoration:none;
    border:1px solid transparent;
  }
  .tag.phone{color:var(--chip-lang);background:color-mix(in srgb,var(--lang) 13%,transparent)}
  .tag.desk{color:var(--chip-ref);background:color-mix(in srgb,var(--ref) 13%,transparent)}
  .tag:hover{border-color:currentColor}
  .none{color:var(--faint)}
  .none b{color:var(--chip-use);font-weight:600}
  .empty{padding:40px 0;color:var(--muted);font-size:14px}
  @media (max-width:520px){
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="topin">
    <div>
      <div class="k">Daily Brief</div>
      <h1>Archive</h1>
    </div>
    <div class="sp"></div>
    <a class="lnk" href="index.html">Today</a>
    <button class="lnk" style="cursor:pointer" onclick="
      const r=document.documentElement;
      r.dataset.theme = r.dataset.theme==='light' ? 'dark' : 'light';
      localStorage.setItem('dbth', r.dataset.theme);">Theme</button>
  </div>
</header>

<div class="wrap">
  <div class="find">
    <input id="q" type="search" placeholder="Filter by date, paper or headline…"
           oninput="draw()" aria-label="Filter the archive">
    <span class="count" id="count"></span>
  </div>
  <div id="out"><p class="empty">Loading…</p></div>
</div>

<script>
/* The list is baked into archive/manifest.json because a browser cannot
   enumerate a directory. It is gitignored, so on the published site this
   fetch 404s and the page says so — an archive that lists editions it
   cannot open would be worse than one that admits it has none. */
var ALL = [];

function nice(iso){
  var d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function month(iso){
  return new Date(iso + 'T00:00:00')
    .toLocaleDateString('en-GB', {month:'long', year:'numeric'});
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function draw(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var rows = ALL.filter(function(e){
    if(!q) return true;
    return (e.date + ' ' + e.newspaper + ' ' + e.mode + ' ' + e.headline)
      .toLowerCase().indexOf(q) !== -1;
  });
  document.getElementById('count').textContent =
    rows.length + (rows.length === 1 ? ' edition' : ' editions');

  if(!rows.length){
    document.getElementById('out').innerHTML =
      '<p class="empty">Nothing matches that.</p>';
    return;
  }

  var html = '', cur = null;
  rows.forEach(function(e){
    if(e.date.slice(0,7) !== cur){
      cur = e.date.slice(0,7);
      html += '<h2 class="month">' + esc(month(e.date)) + '</h2>';
    }
    var links = '<a class="tag phone" href="archive/' + esc(e.date) + '.html">Phone</a>';
    if(e.desk) links += '<a class="tag desk" href="archive/' + esc(e.date) + '-desk.html">Laptop</a>';
    html += '<div class="row">'
      + '<div><div class="d">' + esc(nice(e.date)) + '</div>'
      + '<div class="meta">' + (esc(e.newspaper) || '—')
      + (e.pages ? ' · ' + esc(e.pages) + 'pp' : '') + '</div></div>'
      + '<div>'
      + (e.headline ? '<p class="hl">' + esc(e.headline) + '</p>' : '')
      + '<div class="links">' + links + '</div>'
      + '</div></div>';
  });
  document.getElementById('out').innerHTML = html;
}

fetch('archive/manifest.json', {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){ ALL = d; draw(); })
  .catch(function(){
    document.getElementById('count').textContent = '';
    document.getElementById('out').innerHTML =
      '<p class="empty"><b>Nothing archived here.</b><br>'
      + 'Past editions are kept locally and are not published. '
      + '<a href="index.html" style="color:var(--ink)">Read today&rsquo;s briefing</a>.</p>';
  });

(function(){
  var th = localStorage.getItem('dbth');
  if(th) document.documentElement.dataset.theme = th;
})();
</script>
</body>
</html>
